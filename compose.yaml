services:
  app:
    build: .
    ports:
      - "127.0.0.1:8088:8000"
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      DEMO_MODE: "true"
      SECURE_COOKIES: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:8088,http://localhost:8088
    volumes:
      - riverside-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  riverside-data:
