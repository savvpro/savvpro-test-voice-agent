version:  3.8
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    ports:
      - 5432:5432
    healthcheck:
      test: [CMD, pg_isready, -U, ]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://:@db:5432/
    ports:
      - 8000:8000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  frontend:
    build: ./frontend
    ports:
      - 5173:5173
    depends_on:
      - backend
    command: npm run dev
  model_cache:
    image: alpine
    volumes:
      - model_cache:/root/.cache
volumes:
  model_cache:
