[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice_agent"
version = "0.1.0"
description = "Dental voice assistant AI tool"
requires-python = ">=3.11"
dependencies = [
    "dateparser>=1.2.0",
    "rapidfuzz>=3.0.0",
    "word2number>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper"]
tts = ["edge-tts", "piper-tts"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
