description: "Case 1: Ambiguous time 'at 5' triggers CLARIFY_TIME flow"
today: "2026-10-27"
initial_slots:
  - date: "2026-10-28"
    start: "17:00"
    end: "17:30"
turns:
  - user: "I want to book an appointment"
    expected_state: "COLLECT_SERVICE"
  - user: "checkup"
    expected_state: "COLLECT_DATE"
  - user: "tomorrow"
    expected_state: "COLLECT_TIME"
  - user: "at 5"
    expected_state: "CLARIFY_TIME"
    expected_reply_contains: "morning or evening"
  - user: "evening"
    expected_state: "COLLECT_NAME"
