description: "Case 2: Ambiguous time 'at 5' clarified to morning triggers off-hours message"
today: "2026-10-27"
initial_slots:
  - date: "2026-10-28"
    start: "10:00"
    end: "10:30"
turns:
  - user: "I need a checkup"
    expected_state: "COLLECT_DATE"
  - user: "tomorrow"
    expected_state: "COLLECT_TIME"
  - user: "at 5"
    expected_state: "CLARIFY_TIME"
    expected_reply_contains: "morning or evening"
  - user: "morning"
    expected_state: "COLLECT_TIME"
    expected_reply_contains: "9 AM to 5 PM"
