[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "riverside-lost-property"
version = "0.1.0"
description = "An explainable, rule-driven lost-property voice assistant"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "tzdata>=2025.1",
  "httpx>=0.28,<1", "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10", "pytest-cov>=6,<8", "httpx2",
  "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.8,<3", "pip-tools>=7.5,<9",
]

[project.scripts]
lost-property = "lost_property.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["performance: measured latency checks"]
addopts = "-ra -m 'not performance'"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["lost_property"]

[tool.coverage.report]
show_missing = true
