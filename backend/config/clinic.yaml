# Clinic rules for the voice assistant. The dialogue "brain" reads ONLY this file for
# business rules, so changing hours, services or policy never needs a code change.
#
# Policy values are modelled on published outpatient policies, for example:
#   - Brigham and Women's Hospital Urology, "Late Arrival / No-Show Policy"
#     (new patients arrive 30 min early, established 15 min, 15 min grace period,
#      24-hour cancellation notice, a reschedule inside 24h counts as a cancellation)
#   - Rush University Medical Group, "Office Policies" (24-hour cancellation notice)
# Everything else (names, phone numbers, address) is FAKE demo data.

clinic:
  name: "Maple Street Family Clinic"
  name_ur: "میپل اسٹریٹ فیملی کلینک"
  emergency_en: "911"
  emergency_ur: "1122"   # Rescue 1122 (check the right number for your city)
  timezone: "America/New_York"
  phone: "555-0100"
  address: "100 Example Street, Springfield"
  parking: "Free parking is available in the lot behind the building."

policy:
  cancel_notice_hours: 24        # changes inside this window are "late" and may carry a fee
  late_arrival_grace_minutes: 15 # later than this and we may ask to reschedule
  arrive_early_new_minutes: 30
  arrive_early_established_minutes: 15
  min_lead_minutes: 120          # cannot book a slot starting sooner than this
  max_advance_days: 90
  slot_step_minutes: 15          # appointment start times fall on this grid
  max_verify_attempts: 3
  max_options: 3                 # how many choices we read out loud
  search_horizon_days: 21        # how far ahead "earliest available" looks
  new_patient_service: new_patient_visit
  default_service_for_new_patients: general_consultation

holidays:
  - "2026-11-26"   # Thanksgiving
  - "2026-12-25"
  - "2027-01-01"
  - "2027-05-31"
  - "2027-07-05"
  - "2027-09-06"
  - "2027-11-25"
  - "2027-12-24"

services:
  - key: general_consultation
    name: "general consultation"
    name_ur: "عمومی مشاورت"
    duration_minutes: 30
    requires: any
    keywords: ["general", "consultation", "sick", "cold", "cough", "fever", "flu symptoms", "doctor visit", "see a doctor", "not feeling well", "pain", "sore throat", "rash", "regular visit"]
  - key: new_patient_visit
    name: "new patient visit"
    name_ur: "نئے مریض کی وزٹ"
    duration_minutes: 40
    requires: new
    keywords: ["new patient", "first visit", "first time", "establish care", "new to the clinic"]
  - key: follow_up
    name: "follow-up visit"
    name_ur: "فالو اپ وزٹ"
    duration_minutes: 20
    requires: established
    keywords: ["follow up", "follow-up", "followup", "recheck", "check results", "test results", "review"]
  - key: annual_physical
    name: "annual physical"
    name_ur: "سالانہ جسمانی معائنہ"
    duration_minutes: 45
    requires: any
    keywords: ["physical", "annual", "checkup", "check up", "check-up", "wellness", "yearly"]
  - key: vaccination
