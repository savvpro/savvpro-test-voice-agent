faq:
  - id: hours
    question: "What are your opening hours?"
    keywords: ["hours", "open", "opening", "close", "closing", "time", "days", "weekend", "saturday", "sunday"]
    answer: "We are open Monday to Friday, 8 AM to 5 PM, with limited Saturday hours from 9 AM to noon. We are closed on Sundays and public holidays."
    question_ur: "آپ کے کھلنے کے اوقات کیا ہیں؟"
    answer_ur: "ہم پیر سے جمعہ صبح 8 بجے سے شام 5 بجے تک کھلے ہیں، اور ہفتہ کو محدود اوقات صبح 9 بجے سے دوپہر 12 بجے تک ہیں۔ اتوار اور سرکاری چھٹیوں پر ہم بند ہوتے ہیں۔"
  - id: location
    question: "Where are you located?"
    keywords: ["where", "address", "location", "located", "directions", "find", "street"]
    answer: "We are at 100 Example Street, Springfield."
    question_ur: "آپ کہاں واقع ہیں؟"
    answer_ur: "ہم 100 ایگزیمپل اسٹریٹ، اسپرنگ فیلڈ میں ہیں۔"
  - id: parking
    question: "Is there parking?"
    keywords: ["parking", "park", "car", "lot", "garage"]
    answer: "Free parking is available in the lot behind the building."
    question_ur: "کیا پارکنگ دستیاب ہے؟"
    answer_ur: "عمارت کے پیچھے والے لاٹ میں مفت پارکنگ دستیاب ہے۔"
  - id: bring
    question: "What should I bring to my visit?"
    keywords: ["bring", "documents", "paperwork", "id", "identification", "insurance", "card", "forms", "medications", "need to bring"]
    answer: "Please bring a photo ID, your insurance card, and a list of your current medications. New patients will also complete a short registration form."
    question_ur: "وزٹ پر کیا ساتھ لانا چاہیے؟"
    answer_ur: "براہ کرم اپنا شناختی کارڈ، انشورنس کارڈ، اور اپنی موجودہ ادویات کی فہرست ساتھ لائیں۔ نئے مریض ایک مختصر رجسٹریشن فارم بھی بھریں گے۔"
  - id: arrive
    question: "How early should I arrive?"
    keywords: ["early", "arrive", "arrival", "late", "grace", "minutes", "check-in", "checkin", "how soon"]
    answer: "Please arrive 30 minutes early for a first visit and 15 minutes early otherwise. If you arrive more than 15 minutes late we may ask you to reschedule."
    question_ur: "کتنی دیر پہلے پہنچنا چاہیے؟"
    answer_ur: "پہلی وزٹ کے لیے 30 منٹ پہلے اور دیگر وزٹس کے لیے 15 منٹ پہلے پہنچیں۔ اگر آپ 15 منٹ سے زیادہ تاخیر سے پہنچیں تو ہم آپ سے اپائنٹمنٹ دوبارہ طے کرنے کا کہہ سکتے ہیں۔"
  - id: cancellation
    question: "What is your cancellation policy?"
    keywords: ["cancellation", "cancel", "policy", "fee", "no-show", "noshow", "charge", "notice", "penalty"]
    answer: "We ask for at least 24 hours notice to cancel or reschedule. Changes inside 24 hours are treated as late cancellations and a fee may apply."
    question_ur: "منسوخی کی پالیسی کیا ہے؟"
    answer_ur: "اپائنٹمنٹ منسوخ یا دوبارہ طے کرنے کے لیے ہم کم از کم 24 گھنٹے پہلے اطلاع چاہتے ہیں۔ 24 گھنٹوں کے اندر تبدیلی کو لیٹ کینسلیشن شمار کیا جاتا ہے اور فیس لاگو ہو سکتی ہے۔"
  - id: new_patients
    question: "Are you accepting new patients?"
    keywords: ["new", "accepting", "patients", "register", "registration", "sign up", "join", "establish"]
    answer: "Yes, we are accepting new patients. I can register you and book a new patient visit right now if you like."
    question_ur: "کیا آپ نئے مریض قبول کر رہے ہیں؟"
    answer_ur: "جی ہاں، ہم نئے مریض قبول کر رہے ہیں۔ اگر آپ چاہیں تو میں ابھی آپ کو رجسٹر کر کے نئے مریض کی وزٹ بک کر سکتا ہوں۔"
  - id: insurance
    question: "Which insurance do you accept?"
    keywords: ["insurance", "accept", "coverage", "covered", "plans", "medicare", "medicaid", "insurer", "self-pay", "pay", "payment", "cost", "price"]
    answer: "We accept most major insurance plans. Please call the front desk on 555-0100 to confirm your specific plan before your visit."
    question_ur: "آپ کون سی انشورنس قبول کرتے ہیں؟"
    answer_ur: "ہم زیادہ تر بڑے انشورنس پلانز قبول کرتے ہیں۔ براہ کرم وزٹ سے پہلے اپنے مخصوص پلان کی تصدیق کے لیے فرنٹ ڈیسک کو 555-0100 پر کال کریں۔"
  - id: services
    question: "What services do you offer?"
    keywords: ["services", "offer", "provide", "do you do", "treat", "specialties", "what do you"]
    answer: "We offer general consultations, new patient visits, follow-ups, annual physicals, vaccinations and lab work."
    question_ur: "آپ کون سی خدمات فراہم کرتے ہیں؟"
    answer_ur: "ہم عمومی مشاورت، نئے مریض کی وزٹ، فالو اپ، سالانہ جسمانی معائنہ، ویکسینیشن اور لیب ٹیسٹ فراہم کرتے ہیں۔"
  - id: phone
    question: "What is your phone number?"
    keywords: ["phone", "number", "call", "contact", "reach", "email"]
    answer: "You can reach the front desk on 555-0100 during opening hours."
    question_ur: "آپ کا فون نمبر کیا ہے؟"
    answer_ur: "آپ کھلنے کے اوقات میں فرنٹ ڈیسک سے 555-0100 پر رابطہ کر سکتے ہیں۔"
