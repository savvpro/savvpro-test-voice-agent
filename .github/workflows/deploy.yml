name: Deploy
# Runs only after CI has passed on main. Publishes an image, then asks the host to deploy it and checks health.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never interrupt a deploy that is already running

jobs:
  image:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { ref: "${{ steps.sha.outputs.sha }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Trigger the deploy
        if: ${{ env.HOOK != '' }}
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "deploy requested"
      - name: Wait for the new version to be healthy
        if: ${{ env.PUBLIC_URL != '' }}
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "$PUBLIC_URL/readyz" > /dev/null; then
              echo "ready; running version:"; curl -fsS "$PUBLIC_URL/api/version"; echo; exit 0
            fi
            sleep 15
          done
          echo "service did not become ready in 10 minutes" >&2; exit 1
      - name: Nothing configured
        if: ${{ env.HOOK == '' && env.PUBLIC_URL == '' }}
        run: echo "Set the RENDER_DEPLOY_HOOK_URL secret and the PUBLIC_URL variable to deploy and smoke-test."
