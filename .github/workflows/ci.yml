name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests e2e
      - run: ruff format --check app tests e2e
      # unit, scripted dialogues, golden scenarios, property-based fuzzing, API/auth, migrations vs models
      - run: pytest tests --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: cd frontend && npm ci && npm run build
      - run: rm -rf backend/static && cp -r frontend/dist backend/static
      - run: cd backend && pip install -r requirements-dev.txt && playwright install --with-deps chromium
      # real browser: call flow, lost-response retry, staff area, scenarios tab, axe accessibility checks
      - run: cd backend && pytest e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python dependency audit
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Frontend dependency audit
        run: cd frontend && npm ci && npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clinic-voice-agent .
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clinic-voice-agent
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Container starts and is healthy
        run: |
          docker run -d --name app -p 8000:8000 -e JWT_SECRET=ci-secret-0123456789abcdef0123456789 clinic-voice-agent # gitleaks:allow
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && exit 0; sleep 1; done
          docker logs app; exit 1
